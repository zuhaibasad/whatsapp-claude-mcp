name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Both supported desktops. Keychain tests use Windows Credential Manager / macOS Keychain.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Builds the .mcpb for this OS (windows or macos) and starts it once over stdio.
      - run: npm run build:mcpb
      - run: npm run smoke:mcpb
