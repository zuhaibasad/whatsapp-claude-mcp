<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="wa-bridge: your WhatsApp, briefed by Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1f1a"/><stop offset="1" stop-color="#14302a"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.07" fill="#fff"><circle cx="1130" cy="60" r="150"/><circle cx="1230" cy="300" r="110"/></g>
  <!-- bridge mark -->
  <g transform="translate(90 40)" fill="none" stroke="url(#ac)" stroke-width="10" stroke-linecap="round">
    <rect x="0" y="40" width="64" height="64" rx="18"/><rect x="132" y="40" width="64" height="64" rx="18"/>
    <path d="M70 72h56"/><path d="M82 60l-12 12 12 12M114 60l12 12-12 12" stroke-width="6"/>
  </g>
  <text x="90" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">wa-bridge</text>
  <text x="92" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#a7f3d0">Your WhatsApp, briefed by Claude.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d1fae5">
    <rect x="860" y="110" width="330" height="48" rx="24" fill="#ffffff" fill-opacity="0.1"/><text x="888" y="142">Read-only. Never sends.</text>
    <rect x="860" y="176" width="330" height="48" rx="24" fill="#ffffff" fill-opacity="0.1"/><text x="888" y="208">Encrypted, on your PC.</text>
    <rect x="860" y="242" width="330" height="48" rx="24" fill="#ffffff" fill-opacity="0.1"/><text x="888" y="274">You pick the chats.</text>
  </g>
</svg>
