    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.07" fill="#fff"><circle cx="1130" cy="60" r="150"/><circle cx="1230" cy="300" r="110"/></g>
  <g transform="translate(90 52) scale(0.21)">
