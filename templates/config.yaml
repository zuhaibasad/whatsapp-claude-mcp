# ChatAI for WhatsApp settings.
# Keys use snake_case. Changes are picked up automatically within about a minute.

# How many days of messages to keep in the local store. Older messages are deleted.
# Whole number, 1 or more.
retention_days: 30

# Time zone used for dates, e.g. Asia/Karachi or Europe/London.
# Leave empty to use this computer's time zone.
timezone: ""

# Read messages from group chats?
include_groups: true

# Read messages from one-to-one (direct) chats?
include_direct_chats: false

# Read messages from WhatsApp Channels (newsletters you follow)?
# Channels are public broadcasts; this is off unless you turn it on.
include_channels: false

# Add NEW chats automatically (chats that did not exist when you last picked chats).
# When on, saving a chat selection keeps that type switched on above and puts every chat you did
# not tick on the denylist, so only chats that show up later are added on their own.
# Pick your chats again after turning this on.
# Direct chats: anyone who messages you for the first time would be read, so this is off unless you turn it on.
auto_add_new_groups: false
auto_add_new_direct_chats: false

# Let Claude send a private (1-to-1) text to someone who posted in a chat you read, e.g. to ask a price.
# Every message needs your OK, showing the exact text and recipient: a prompt inside Claude when Claude
# supports it, otherwise a Windows/macOS pop-up. Claude (the AI) cannot answer either one.
# Never sends to groups or channels. At most 1 message per 20 seconds and 30 per day.
# WhatsApp may ban numbers that send through unofficial apps: use it for a few personal messages only.
# Restart Claude after changing this.
allow_sending: false

# Chats to include even when their type is switched off above.
# Each entry is a chat name or a chat id. Names are matched case-insensitively. Example:
#   allowlist:
#     - "Project Team"
allowlist: []

# Chats to always skip. Each entry is a chat name or a chat id, same as allowlist.
# The denylist wins: a chat on both lists is skipped.
denylist: []

# Your names and nicknames, e.g. Zuhaib, Zuhaib bhai, ZA, for mention detection in text.
my_names: []

# Longest message text kept. Longer text is cut short.
max_text_chars: 2000

# Images (bills, payment screenshots) in selected chats: download them, stored encrypted on this PC.
media_download: true

# Read the text in those images on this PC (tesseract OCR), so Claude gets text instead of the image.
media_ocr: true

# Most image storage in MB. The oldest images are dropped first; their OCR text is kept.
media_max_mb: 500

# How much the daemon writes to its log: error, warn, info or debug.
log_level: info
